
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokengama Global Partners - Solutions Globales d'Investissement et Multisectorielles</title>
    <style>
        :root {
            --primary-color: #003366;
            --accent-color: #f39c12;
            --text-color: #333333;
            --bg-light: #f9f9f9;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            color: var(--text-color);
            background-color: var(--bg-light);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 2rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section-title {
            text-align: center;
            margin-bottom: 2.5rem;
            color: var(--primary-color);
            font-size: 2rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background-color: var(--accent-color);
            margin: 0.5rem auto 0;
            border-radius: 2px;
        }

        .grid-services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .service-card {
            background: var(--white);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .service-card:hover {
            transform: translateY(-55px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .card-image-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            position: relative;
        }

        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .service-card:hover .card-image-container img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-content h3 {
            color: var(--primary-color);
            font-size: 1.4rem;
            margin-bottom: 0.8rem;
        }

        .card-content p {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 1.2rem;
            flex-grow: 1;
        }

        .btn-details {
            align-self: flex-start;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-details:hover {
            background-color: var(--accent-color);
            color: var(--primary-color);
        }

        footer {
            background-color: var(--primary-color);
            color: var(--white);
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 3rem;
        }

        footer p {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
